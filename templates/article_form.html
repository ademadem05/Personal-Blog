{% extends "base.html" %}
{% block title %}{{heading}}{% endblock title %}

{% block content %}
    <h2>{{heading}}</h2>

    {% if error %}
        <p style = "color: red;">{{error}}</p>
    {% endif %}

    <form method="post">
        <p>
            <label for="">Title:</label><br>
            <input type="text" name="title" value="{{ article.title }}" required>
        </p>
        <p>
            <label for="">Date:</label><br>
            <input type="date" name = "date" value = "{{article.date}}" required>
        </p>

        <p>
            <label>Content:</label><br>
            <textarea name="content" rows="12" cols="60" required>{{article.content}}</textarea>
        </p>

        <button type="submit">Save</button>
        <a href="{{url_for('dashboard')}}">Cancel</a>

    </form>
{% endblock content %}
