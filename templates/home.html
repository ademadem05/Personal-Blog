{% extends "base.html" %}

{% block content %}

    <p><button><a href = "{{ url_for('login') }}">Login</a></button></p>
    {% if articles %}
        <ul>
        {% for article in articles %}
            <li>
                <a href="{{ url_for('show_article', article_id=article.id) }}">{{ article.title }}</a>
                <small>{{ article.date }}</small>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No articles yet.</p>
    {% endif %}
{% endblock content %}
